version: "3.8"

services:
  # =========================================================================
  # 1. Existing Valheim Dedicated Server (lloesche/valheim-server)
  # =========================================================================
  valheim-server:
    image: lloesche/valheim-server:latest
    container_name: valheim-server
    cap_add:
      - sys_nice
    stop_grace_period: 120s
    ports:
      - "2456-2457:2456-2457/udp"
    volumes:
      - valheim_config:/config
      - valheim_data:/opt/valheim
    environment:
      - SERVER_NAME=${SERVER_NAME:-Valhalla Dedicated}
      - WORLD_NAME=${WORLD_NAME:-Midgard}
      - SERVER_PASS=${SERVER_PASS:-secretpass}
      - SERVER_PUBLIC=${SERVER_PUBLIC:-true}
      - CROSSPLAY=${CROSSPLAY:-true}
      - BACKUPS=true
      - BACKUPS_CRON=5 * * * *
      - BACKUPS_MAX_AGE=7
      - UPDATE_CRON=*/15 * * * *
      - RESTART_CRON=10 5 * * *
      - STATUS_HTTP=true
      - STATUS_HTTP_PORT=80
      - SUPERVISOR_HTTP=true
      - SUPERVISOR_HTTP_PORT=9001
      - SUPERVISOR_HTTP_USER=admin
      - SUPERVISOR_HTTP_PASS=${SUPERVISOR_PASS:-secretpass}
    restart: unless-stopped
    networks:
      - valheim_net

  # =========================================================================
  # 2. Companion Web Dashboard Container (Heimdall Watchtower)
  #    Pulls directly from GitHub Container Registry (GHCR) in Portainer!
  # =========================================================================
  valheim-watchtower:
    image: ghcr.io/oliver-poulter/valheimmonitor:latest
    container_name: valheim-watchtower
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    volumes:
      # Mount Docker socket to control valheim-server, run supervisorctl, and stream logs/stats
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount the SAME /config volume or host path used by lloesche/valheim-server
      - valheim_config:/config
    environment:
      - PORT=3000
      - VALHEIM_CONTAINER_NAME=valheim-server
      - VALHEIM_HOST=valheim-server
      - VALHEIM_CONFIG_DIR=/config
      - SERVER_NAME=${SERVER_NAME:-Valhalla Dedicated}
      - WORLD_NAME=${WORLD_NAME:-Midgard}
      - RCON_PORT=2458
      - RCON_PASS=${RCON_PASS:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    depends_on:
      - valheim-server
    restart: unless-stopped
    networks:
      - valheim_net

volumes:
  valheim_config:
  valheim_data:

networks:
  valheim_net:
    driver: bridge
